<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Монте — заказ без очереди</title>
<meta name="description" content="Предзаказ еды в кафе «Монте» при МГИМО. Забирай по номеру, без очереди.">

<!-- Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Tailwind (только для прототипа; для боевой версии соберём статикой) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + Babel -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #EFECE7; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* Telegram Mini App: если открыто внутри Telegram — убираем демо-рамку */
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const IN_TG = !!(TG && TG.initData);
const TG_NAME = TG && TG.initDataUnsafe && TG.initDataUnsafe.user
  ? TG.initDataUnsafe.user.first_name : "";
if (TG) { TG.ready(); TG.expand(); }


/* ================================================================== */
/*  Токены — сняты с фотографий кафе                                  */
/* ================================================================== */
const T = {
  bg: "#EFECE7", surface: "#FBFAF8", ink: "#2B2422", inkSoft: "#6B615C",
  terra: "#D2683C", terraLt: "#F6E5DA", brick: "#9C4A4E", coral: "#F08A7C",
  line: "#DFD9D1", green: "#5B7A52", bar: "#7C6A9C",
};
const DISPLAY = "'Unbounded', 'Trebuchet MS', sans-serif";
const SANS = "'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
const SCRIPT = "'Caveat', cursive";

/* ================================================================== */
const NOW = 12 * 60 + 5;
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3));

const mk = (t, o = {}) => ({
  t, peak: !!o.peak,
  kCap: o.peak ? 20 : 10, kTaken: o.k || 0,
  bCap: o.peak ? 25 : 15, bTaken: o.b || 0,
});
const grid = (from, to) => {
  const out = [];
  for (let m = toMin(from); m <= toMin(to); m += 15) out.push(mk(hhmm(m)));
  return out;
};

const MORNING = grid("08:00", "11:45");
MORNING[4].bTaken = 9; MORNING[5].bTaken = 12; MORNING[8].kTaken = 4;

const LUNCH = [
  mk("11:55", { peak: 1, k: 20, b: 22 }), mk("12:10", { peak: 1, k: 17, b: 14 }),
  mk("12:25", { k: 8, b: 6 }), mk("12:40", { k: 3, b: 4 }), mk("12:55", { k: 1, b: 2 }),
  mk("13:10", { k: 2, b: 3 }), mk("13:30", { peak: 1, k: 15, b: 18 }),
  mk("13:45", { peak: 1, k: 11, b: 9 }), mk("14:00", { k: 4, b: 5 }),
  mk("14:15", { k: 2, b: 2 }), mk("14:30", { k: 1, b: 1 }),
];

const EVENING = grid("14:45", "18:45");
EVENING[2].bTaken = 5; EVENING[7].kTaken = 3;

const GROUPS = [
  { id: "m", title: "Утро", sub: "8:00 – 11:45", slots: MORNING },
  { id: "l", title: "Обед", sub: "11:55 – 14:30 · два пика", slots: LUNCH },
  { id: "e", title: "День и вечер", sub: "14:45 – 18:45", slots: EVENING },
];
const ALL_SLOTS = GROUPS.flatMap((g) => g.slots);
const slotByTime = (t) => ALL_SLOTS.find((s) => s.t === t);
const leftOf = (s, st) => (st === "bar" ? s.bCap - s.bTaken : s.kCap - s.kTaken);

const plural = (n, f) => {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return f[0];
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return f[1];
  return f[2];
};
const seats = (n) => `${n} ${plural(n, ["место", "места", "мест"])}`;

/* ================================================================== */
const MENU = [
  { cat: "Кофе", station: "bar", items: [
    { id: "c1", name: "Капучино", price: 220, desc: "Двойной эспрессо, молоко на выбор", min: 3 },
    { id: "c2", name: "Латте", price: 230, desc: "Эспрессо, молоко, тонкая пена", min: 3 },
    { id: "c3", name: "Раф ванильный", price: 260, desc: "Эспрессо, сливки, ваниль", min: 4 },
    { id: "c4", name: "Американо", price: 170, desc: "Двойной эспрессо, горячая вода", min: 2 },
    { id: "c5", name: "Флэт уайт", price: 250, desc: "Двойной эспрессо, молоко", min: 3 },
  ]},
  { cat: "Напитки", station: "bar", items: [
    { id: "d1", name: "Апельсиновый фреш", price: 290, desc: "250 мл, без сахара", min: 4 },
    { id: "d2", name: "Домашний лимонад", price: 260, desc: "400 мл, мята и лайм", min: 3 },
    { id: "d3", name: "Молочный коктейль", price: 290, desc: "Пломбир, 400 мл", min: 4 },
    { id: "d4", name: "Матча латте", price: 280, desc: "Матча, молоко на выбор", min: 4 },
    { id: "d5", name: "Горячий шоколад", price: 250, desc: "Тёмный шоколад, 250 мл", min: 4 },
  ]},
  { cat: "Завтраки", station: "kitchen", items: [
    { id: "b1", name: "Сырники со сметаной", price: 320, desc: "4 шт., сметана, ягодный соус", min: 6 },
    { id: "b2", name: "Овсяная каша с бананом", price: 210, desc: "Хлопья, молоко, банан, мёд", min: 5 },
    { id: "b3", name: "Омлет с томатами", price: 280, desc: "3 яйца, томаты, зелень, тост", min: 8 },
  ]},
  { cat: "Паста", station: "kitchen", items: [
    { id: "p1", name: "Карбонара", price: 480, desc: "Спагетти, яйцо, сливки, бекон", min: 14 },
    { id: "p2", name: "Помодоро", price: 340, desc: "Пенне, томаты пилати, базилик", min: 12 },
    { id: "p3", name: "С курицей и грибами", price: 480, desc: "Спагетти, филе, вешенки", min: 14 },
    { id: "p4", name: "С креветками и томатами", price: 620, desc: "Спагетти, тигровые креветки", min: 16, stop: true },
    { id: "p5", name: "С лососем и икрой тобико", price: 620, desc: "Спагетти, лосось, тобико", min: 16 },
  ]},
  { cat: "Пицца", station: "kitchen", items: [
    { id: "z1", name: "Маргарита", price: 650, desc: "Томаты, моцарелла, базилик", min: 14 },
    { id: "z2", name: "Чоризо", price: 720, desc: "Чоризо, моцарелла, томатный соус", min: 15 },
    { id: "z3", name: "С лососем и креветками", price: 990, desc: "Лосось, креветки, сливки", min: 17 },
  ]},
];

const ALL = MENU.flatMap((s) => s.items.map((i) => ({ ...i, station: s.station })));
const byId = (id) => ALL.find((i) => i.id === id);
const FEE = 39;
const LAST_ORDER = { p1: 1, c1: 1 };

const QUEUE = [
  { num: "45", who: "Марк Д.", at: "12:10", st: "kitchen", items: [["Помодоро", 1]], state: "cooking", left: 5 },
  { num: "46", who: "Алиса К.", at: "12:10", st: "bar", items: [["Латте", 2]], state: "new", left: 5 },
  { num: "47", who: "Ты", at: "12:25", st: "kitchen", items: [["Карбонара", 1], ["Капучино", 1]], state: "new", left: 20 },
];

/* ================================================================== */
const Ico = ({ name, c }) => {
  const p = {
    home: <><path d="M3 10.5 12 3l9 7.5" /><path d="M5.5 9.7V21h13V9.7" /></>,
    menu: <><path d="M4 6.5h16" /><path d="M4 12h16" /><path d="M4 17.5h11" /></>,
    bag: <><path d="M6 8h12l1.1 12.2H4.9L6 8z" /><path d="M9 8.4V6.2a3 3 0 0 1 6 0v2.2" /></>,
  };
  return (
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke={c}
         strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {p[name]}
    </svg>
  );
};

const Rub = ({ v }) => <span>{v.toLocaleString("ru-RU")}&nbsp;₽</span>;

function Fonts() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Onest:wght@400;500;600&family=Caveat:wght@600&display=swap');
      * { box-sizing: border-box; }
      button { font-family: ${SANS}; cursor: pointer; border: none; background: none; }
      button:focus-visible { outline: 2px solid ${T.terra}; outline-offset: 2px; }
      .mk-scroll::-webkit-scrollbar { display: none; }
      .mk-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes mkRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .mk-rise { animation: mkRise .35s ease-out both; }
      @media (prefers-reduced-motion: reduce) { .mk-rise { animation: none; } }
    `}</style>
  );
}

/* ================================================================== */
function SlotChip({ s, on, pick, station }) {
  const n = leftOf(s, station);
  const past = toMin(s.t) < NOW;
  const full = n <= 0 || past;
  const low = !full && n <= 4;
  const taken = station === "bar" ? s.bTaken : s.kTaken;
  const cap = station === "bar" ? s.bCap : s.kCap;
  const pct = Math.min(100, (taken / cap) * 100);

  return (
    <button onClick={() => !full && pick(s.t)} disabled={full}
      aria-label={`${s.t}, ${past ? "прошло" : full ? "мест нет" : "свободно " + seats(n)}`}
      className="rounded-xl flex-shrink-0 text-left overflow-hidden"
      style={{
        background: on ? T.terra : full ? "transparent" : T.surface,
        color: on ? "#FFF8F4" : full ? T.inkSoft : T.ink,
        border: `1px solid ${on ? T.terra : s.peak && !full ? T.brick : T.line}`,
        minWidth: 104, cursor: full ? "not-allowed" : "pointer", opacity: full ? 0.45 : 1,
      }}>
      <div className="px-3 pt-2.5 pb-2">
        <div className="flex items-baseline gap-1.5">
          <span style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 15.5 }}>{s.t}</span>
          {s.peak && !full && <span style={{ fontSize: 9, letterSpacing: 0.5, color: on ? "#FFF8F4" : T.brick, fontWeight: 600 }}>ПИК</span>}
        </div>
        <div style={{ fontSize: 11, marginTop: 4, fontWeight: low ? 600 : 400 }}>
          {past ? <span style={{ opacity: 0.7 }}>прошло</span>
            : n <= 0 ? <span style={{ color: on ? "#FFF8F4" : T.brick }}>мест нет</span>
            : low ? <span style={{ color: on ? "#FFF8F4" : T.brick }}>ещё {n}</span>
            : <span style={{ opacity: 0.6 }}>свободно {n}</span>}
        </div>
      </div>
      <div style={{ height: 3, background: on ? "rgba(255,248,244,.3)" : T.line }}>
        <div style={{ height: 3, width: `${pct}%`, background: on ? "#FFF8F4" : low ? T.brick : T.terra }} />
      </div>
    </button>
  );
}

function SlotPicker({ slot, setSlot, station }) {
  const [open, setOpen] = useState("l");
  return (
    <div>
      {GROUPS.map((g) => {
        const isOpen = open === g.id;
        const free = g.slots.reduce((a, s) => a + (toMin(s.t) < NOW ? 0 : Math.max(0, leftOf(s, station))), 0);
        return (
          <div key={g.id} style={{ borderBottom: `1px solid ${T.line}` }}>
            <button onClick={() => setOpen(isOpen ? "" : g.id)} className="w-full flex items-center justify-between py-3 gap-3">
              <div className="text-left">
                <div style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 14, color: T.ink }}>{g.title}</div>
                <div style={{ fontSize: 11.5, color: T.inkSoft, marginTop: 2 }}>{g.sub}</div>
              </div>
              <span style={{ fontSize: 11.5, color: T.inkSoft, whiteSpace: "nowrap" }}>
                {free > 0 ? `свободно ${free}` : "закрыто"} {isOpen ? "▴" : "▾"}
              </span>
            </button>
            {isOpen && (
              <div className="flex gap-2 pb-3 overflow-x-auto mk-scroll">
                {g.slots.map((s) => <SlotChip key={s.t} s={s} on={slot === s.t} pick={setSlot} station={station} />)}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ================================================================== */
function Welcome({ start }) {
  const steps = [
    ["Собираешь заказ", "Меню то же, что на досках у раздачи. Цены те же."],
    ["Выбираешь время", "Прямо сейчас или к концу пары — на любые 15 минут."],
    ["Забираешь по номеру", "Приходишь, называешь номер, уходишь. Очередь не нужна."],
  ];
  return (
    <div className="px-5 pt-8 pb-8 mk-rise">
      <h1 style={{ fontFamily: DISPLAY, fontWeight: 600, fontSize: 27, color: T.ink, lineHeight: 1.2 }}>
        Обед<br />без очереди
      </h1>
      <p style={{ fontSize: 14.5, color: T.inkSoft, marginTop: 10, lineHeight: 1.5 }}>
        В перерыв к раздаче стоит полкорпуса. Закажи заранее и просто забери.
      </p>
      <div className="mt-7">
        {steps.map(([t, d], i) => (
          <div key={t} className="flex gap-3.5 py-3.5" style={{ borderBottom: i < 2 ? `1px solid ${T.line}` : "none" }}>
            <div className="rounded-full flex items-center justify-center flex-shrink-0"
              style={{ width: 26, height: 26, background: T.terraLt, color: T.terra, fontFamily: DISPLAY, fontWeight: 600, fontSize: 12 }}>
              {i + 1}
            </div>
            <div>
              <div style={{ fontSize: 15.5, fontWeight: 500, color: T.ink }}>{t}</div>
              <div style={{ fontSize: 13, color: T.inkSoft, marginTop: 3, lineHeight: 1.45 }}>{d}</div>
            </div>
          </div>
        ))}
      </div>
      <button onClick={start} className="w-full rounded-xl mt-7 py-4"
        style={{ background: T.terra, color: "#FFF8F4", fontWeight: 600, fontSize: 16 }}>
        Смотреть меню
      </button>
      <p style={{ fontSize: 12, color: T.inkSoft, marginTop: 12, textAlign: "center", lineHeight: 1.5 }}>
        Сервисный сбор 39 ₽ за заказ. Цены на еду — как на кассе.
      </p>
    </div>
  );
}

/* ================================================================== */
function Home({ go, repeat, mode, setMode, slot, setSlot }) {
  const total = Object.entries(LAST_ORDER).reduce((s, [id, q]) => s + byId(id).price * q, 0);
  const names = Object.keys(LAST_ORDER).map((id) => byId(id).name).join(" · ");
  const peakNow = NOW >= toMin("11:55") && NOW <= toMin("12:20");
  const wait = peakNow ? 18 : 8;

  return (
    <div className="mk-rise">
      <div className="px-5 pt-6 pb-1">
        <div className="flex items-baseline justify-between">
          <p style={{ color: T.inkSoft, fontSize: 13.5 }}>Понедельник, {hhmm(NOW)}</p>
          <p style={{ color: T.inkSoft, fontSize: 12 }}>кухня до 19:00</p>
        </div>
        <h1 style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 24, lineHeight: 1.2, color: T.ink, marginTop: 6 }}>
          Привет{TG_NAME ? `, ${TG_NAME}` : ", Артём"}
        </h1>
      </div>

      <div className="px-5 pt-4">
        <div className="rounded-2xl p-5" style={{ background: T.surface, border: `1px solid ${T.line}` }}>
          <p style={{ fontSize: 12, color: T.terra, fontWeight: 600, letterSpacing: 0.3 }}>ТВОЙ ОБЫЧНЫЙ ЗАКАЗ</p>
          <p style={{ fontSize: 17.5, color: T.ink, marginTop: 8, lineHeight: 1.35, fontWeight: 500 }}>{names}</p>
          <button onClick={repeat} className="w-full rounded-xl mt-4 py-3.5"
            style={{ background: T.terra, color: "#FFF8F4", fontWeight: 600, fontSize: 15.5 }}>
            Повторить за <Rub v={total + FEE} />
          </button>
          <p style={{ fontSize: 12, color: T.inkSoft, marginTop: 10, textAlign: "center" }}>
            {mode === "now" ? `Готово примерно к ${hhmm(NOW + wait)}` : `К ${slot}`}
          </p>
        </div>
      </div>

      <div className="px-5 pt-7">
        <div className="flex rounded-xl p-1" style={{ background: T.surface, border: `1px solid ${T.line}` }}>
          {[["now", "Прямо сейчас"], ["time", "Ко времени"]].map(([id, lbl]) => (
            <button key={id} onClick={() => setMode(id)} className="flex-1 rounded-lg py-2.5"
              style={{
                background: mode === id ? T.ink : "transparent", color: mode === id ? T.bg : T.inkSoft,
                fontSize: 13.5, fontWeight: mode === id ? 600 : 400,
              }}>{lbl}</button>
          ))}
        </div>

        {mode === "now" ? (
          <div className="rounded-2xl mt-3 p-4"
            style={{ background: peakNow ? "#F7E7E7" : T.surface, border: `1px solid ${peakNow ? T.brick : T.line}` }}>
            <div className="flex items-baseline justify-between">
              <span style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 17, color: T.ink }}>~{hhmm(NOW + wait)}</span>
              <span style={{ fontSize: 12.5, color: peakNow ? T.brick : T.inkSoft, fontWeight: peakNow ? 600 : 400 }}>
                {peakNow ? "сейчас пик" : "спокойно"}
              </span>
            </div>
            <p style={{ fontSize: 12.5, color: T.ink, marginTop: 6, lineHeight: 1.45 }}>
              {peakNow
                ? "Все вышли с пар разом. Если не горит — возьми на 12:40, будет готово за 8 минут."
                : "Очереди нет, кухня свободна."}
            </p>
          </div>
        ) : (
          <div className="mt-1"><SlotPicker slot={slot} setSlot={setSlot} station="kitchen" /></div>
        )}
      </div>

      <div className="px-5 pt-7 pb-8">
        <p style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 15, color: T.ink }}>Меню</p>
        <div className="grid grid-cols-2 gap-3 mt-3">
          {MENU.map((s) => (
            <button key={s.cat} onClick={() => go("menu", s.cat)} className="rounded-xl p-4 text-left"
              style={{ background: T.surface, border: `1px solid ${T.line}`, minHeight: 86 }}>
              <div style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 15, color: T.ink }}>{s.cat}</div>
              <div style={{ fontSize: 11.5, color: s.station === "bar" ? T.bar : T.inkSoft, marginTop: 6 }}>
                {s.station === "bar" ? "бар" : "кухня"} · от <Rub v={Math.min(...s.items.map((i) => i.price))} />
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
function Menu({ cart, add, remove, openCat, setOpenCat }) {
  const sec = MENU.find((s) => s.cat === openCat);
  return (
    <div className="mk-rise pb-8">
      <div className="flex gap-2 px-5 py-3 overflow-x-auto mk-scroll sticky top-0"
           style={{ background: T.bg, borderBottom: `1px solid ${T.line}`, zIndex: 5 }}>
        {MENU.map((s) => {
          const on = openCat === s.cat;
          return (
            <button key={s.cat} onClick={() => setOpenCat(s.cat)} className="rounded-full px-4 py-2 flex-shrink-0"
              style={{
                background: on ? T.ink : "transparent", color: on ? T.bg : T.inkSoft,
                border: `1px solid ${on ? T.ink : T.line}`, fontSize: 13.5, fontWeight: on ? 500 : 400,
              }}>{s.cat}</button>
          );
        })}
      </div>

      <div className="px-5 pt-2">
        <p style={{ fontSize: 11.5, color: sec.station === "bar" ? T.bar : T.inkSoft, paddingTop: 8 }}>
          {sec.station === "bar" ? "Готовит бар — своя очередь, обычно 3–4 минуты" : "Готовит кухня"}
        </p>
        {sec.items.map((it) => {
          const q = cart[it.id] || 0;
          return (
            <div key={it.id} className="flex gap-4 py-4"
                 style={{ borderBottom: `1px solid ${T.line}`, opacity: it.stop ? 0.4 : 1 }}>
              <div className="flex-1">
                <div style={{ fontSize: 16, fontWeight: 500, color: T.ink }}>{it.name}</div>
                <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 4, lineHeight: 1.45 }}>{it.desc}</div>
                <div className="flex items-center gap-3 mt-2.5" style={{ fontSize: 13.5 }}>
                  <span style={{ fontFamily: DISPLAY, fontWeight: 500, color: T.ink }}><Rub v={it.price} /></span>
                  <span style={{ color: T.inkSoft }}>{it.min} мин</span>
                </div>
              </div>
              <div className="flex items-end">
                {it.stop ? <span style={{ fontSize: 12.5, color: T.brick }}>закончилось</span>
                  : q === 0 ? (
                    <button onClick={() => add(it.id)} className="rounded-full"
                      style={{ width: 40, height: 40, background: T.terra, color: "#FFF8F4", fontSize: 22 }}
                      aria-label={`Добавить ${it.name}`}>+</button>
                  ) : (
                    <div className="flex items-center gap-3 rounded-full px-2" style={{ background: T.terra, color: "#FFF8F4" }}>
                      <button onClick={() => remove(it.id)} style={{ color: "#FFF8F4", width: 28, height: 40, fontSize: 20 }}>−</button>

function Cart({ cart, add, remove, mode, setMode, slot, setSlot, pay }) {
  const ids = Object.keys(cart);

  const barOnly = ids.length > 0 && ids.every((id) => byId(id).station === "bar");
  const station = barOnly ? "bar" : "kitchen";
  const slowest = ids.length ? Math.max(...ids.map((id) => byId(id).min)) : 0;
  const chosen = slotByTime(slot);
  const n = chosen ? leftOf(chosen, station) : 0;

      <div className="px-5 pt-6">
        <p style={{ fontFamily: DISPLAY, fontWeight: 500, fontSize: 15, color: T.ink }}>Стоп-лист</p>
        <p style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 4 }}>Выключенное сразу пропадает у студентов.</p>
        <div className="mt-3">
          {ALL.slice(10, 16).map((it) => {
            const off = !!stops[it.id];
            return (
              <button key={it.id} onClick={() => setStops((s) => ({ ...s, [it.id]: !off }))}
                className="w-full flex items-center justify-between py-3 gap-3"
                style={{ borderBottom: `1px solid ${T.line}` }}>
                <span style={{ fontSize: 14.5, color: off ? T.inkSoft : T.ink, textAlign: "left" }}>{it.name}</span>
                <span className="rounded-full flex items-center flex-shrink-0"
                  style={{
                    width: 44, height: 26, background: off ? T.line : T.green, padding: 3,
                    justifyContent: off ? "flex-start" : "flex-end",
                  }}>
                  <span className="rounded-full" style={{ width: 20, height: 20, background: "#FBFAF8" }} />
                </span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
function App() {
  const [role, setRole] = useState("student");
  const [tab, setTab] = useState("home");
  const [openCat, setOpenCat] = useState("Кофе");
  const [cart, setCart] = useState({});
  const [mode, setMode] = useState("now");
  const [slot, setSlot] = useState("12:40");

  const add = (id) => setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const remove = (id) =>
    setCart((c) => {
      const n = (c[id] || 0) - 1;
      const next = { ...c };
      if (n <= 0) delete next[id]; else next[id] = n;
      return next;
    });

  const count = useMemo(() => Object.values(cart).reduce((a, b) => a + b, 0), [cart]);
  const sum = useMemo(() => Object.entries(cart).reduce((a, [id, q]) => a + byId(id).price * q, 0), [cart]);

  const go = (t, cat) => { if (cat) setOpenCat(cat); setTab(t); };
  const repeat = () => { setCart(LAST_ORDER); setTab("cart"); };

  const TABS = [
    { id: "home", label: "Главная", icon: "home" },
    { id: "menu", label: "Меню", icon: "menu" },
    { id: "cart", label: "Заказ", icon: "bag" },
  ];

  return (
    <div className="w-full flex justify-center" style={{
      background: IN_TG ? T.bg : "#D9D5CF",
      minHeight: "100vh", fontFamily: SANS, padding: IN_TG ? 0 : "24px 0",
    }}>
      <Fonts />
      <div className="w-full" style={{ maxWidth: IN_TG ? "none" : 400 }}>
        {!IN_TG && (
          <div className="flex gap-2 px-5 pb-3">
            {[["student", "Студент"], ["intro", "Первый вход"], ["admin", "Кухня"]].map(([r, lbl]) => (
              <button key={r} onClick={() => { setRole(r); setTab("home"); setCart({}); }}
                className="rounded-full px-3.5 py-1.5"
                style={{
                  background: role === r ? T.ink : "transparent",
                  color: role === r ? T.bg : T.ink,
                  border: `1px solid ${role === r ? T.ink : "rgba(43,36,34,.25)"}`,
                  fontSize: 12.5,
                }}>{lbl}</button>
            ))}
          </div>
        )}

        <div className={IN_TG ? "overflow-hidden" : "rounded-2xl overflow-hidden"}
             style={{ background: T.bg, boxShadow: IN_TG ? "none" : "0 18px 40px rgba(43,36,34,.2)" }}>
          <div className="px-5 py-3.5 flex items-center justify-between" style={{ background: T.ink }}>
            <div>
              <div style={{ fontFamily: DISPLAY, fontWeight: 600, fontSize: 17, color: T.terra, lineHeight: 1 }}>МОНТЕ</div>
              <div style={{ fontSize: 8.5, color: T.coral, letterSpacing: 3, marginTop: 3 }}>КАФЕ</div>
            </div>
            <span style={{ fontSize: 11.5, color: "rgba(239,236,231,.55)" }}>МГИМО · корпус А</span>
          </div>

          <div style={{ minHeight: 580 }}>
            {role === "admin" ? <Kitchen />
              : role === "intro" ? <Welcome start={() => { setRole("student"); setTab("menu"); }} />
              : tab === "home" ? <Home go={go} repeat={repeat} mode={mode} setMode={setMode} slot={slot} setSlot={setSlot} />
              : tab === "menu" ? <Menu cart={cart} add={add} remove={remove} openCat={openCat} setOpenCat={setOpenCat} />
              : tab === "cart" ? <Cart cart={cart} add={add} remove={remove} mode={mode} setMode={setMode} slot={slot} setSlot={setSlot} pay={() => setTab("ticket")} />
              : <Ticket mode={mode} slot={slot} back={() => { setCart({}); setTab("home"); }} />}
          </div>

          {role === "student" && tab !== "ticket" && (
            <div>
              {count > 0 && tab !== "cart" && (
                <button onClick={() => setTab("cart")} className="w-full flex items-center justify-between px-5 py-3.5"
                  style={{ background: T.terra, color: "#FFF8F4" }}>
                  <span style={{ fontSize: 14.5, fontWeight: 600 }}>Перейти к заказу · {count}</span>
                  <span style={{ fontFamily: DISPLAY, fontWeight: 600, fontSize: 15 }}><Rub v={sum + FEE} /></span>
                </button>
              )}
              <nav className="flex" style={{ background: T.ink }}>
                {TABS.map((t) => {
                  const on = tab === t.id;
                  const col = on ? T.terra : "rgba(239,236,231,.55)";
                  return (
                    <button key={t.id} onClick={() => setTab(t.id)} aria-current={on ? "page" : undefined}
                      className="flex-1 flex flex-col items-center justify-center gap-1"
                      style={{ height: 66, position: "relative" }}>
                      <span style={{ position: "relative", display: "block" }}>
                        <Ico name={t.icon} c={col} />
                        {t.id === "cart" && count > 0 && (
                          <span className="rounded-full flex items-center justify-center"
                            style={{
                              position: "absolute", top: -5, right: -8, minWidth: 18, height: 18,
                              padding: "0 5px", background: T.terra, color: "#FFF8F4", fontSize: 11, fontWeight: 700,
                            }}>{count}</span>
                        )}
                      </span>
                      <span style={{ fontSize: 11.5, color: on ? "#FFF8F4" : "rgba(239,236,231,.55)", fontWeight: on ? 600 : 400 }}>
                        {t.label}
                      </span>
                      {on && <span style={{ position: "absolute", top: 0, left: "22%", right: "22%", height: 2.5, background: T.terra }} />}
                    </button>
                  );
                })}
              </nav>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
