<script>

function toMin(t){return +t.slice(0,2)*60 + +t.slice(3);}
function rub(v){return v.toLocaleString("ru-RU")+" ₽";}
function plural(n,f){var a=n%10,b=n%100;if(a===1&&b!==11)return f[0];if(a>=2&&a<=4&&(b<12||b>14))return f[1];return f[2];}

 {cat:"Завтраки",station:"kitchen",items:[

/* ---------- слоты ---------- */
function chip(s,st){
 var n=leftOf(s,st),past=toMin(s.t)<NOW,full=n<=0||past,low=!full&&n<=4,on=S.slot===s.t;
 var taken=st==="bar"?s.bTaken:s.kTaken, cap=st==="bar"?s.bCap:s.kCap;
 var pct=Math.min(100,taken/cap*100);
 var cls="chip"+(on?" on":"")+(full?" off":(s.peak?" peak":""));
 var txt = past?'<span style="opacity:.7">прошло</span>'
   : n<=0?'<span style="color:'+(on?"#FFF8F4":"var(--brick)")+';font-weight:600">мест нет</span>'
   : low?'<span style="color:'+(on?"#FFF8F4":"var(--brick)")+';font-weight:600">ещё '+n+'</span>'
   : '<span style="opacity:.6">свободно '+n+'</span>';
 return '<button class="'+cls+'"'+(full?' disabled':' data-act="slot" data-v="'+s.t+'"')+'>'
  +'<div class="in"><div class="tm">'+s.t+(s.peak&&!full?' <span style="font-size:9px;letter-spacing:.5px;color:'+(on?"#FFF8F4":"var(--brick)")+';font-weight:600">ПИК</span>':'')+'</div>'
  +'<div class="st">'+txt+'</div></div>'
  +'<div class="bar"><i style="width:'+pct+'%'+(low&&!on?';background:var(--brick)':'')+'"></i></div></button>';
}
function picker(st){
 return GROUPS.map(function(g){
  var open=S.grp===g.id,free=0;
  g.slots.forEach(function(s){if(toMin(s.t)>=NOW)free+=Math.max(0,leftOf(s,st));});
  return '<div style="border-bottom:1px solid var(--line)">'
   +'<button data-act="grp" data-v="'+g.id+'" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;text-align:left">'
   +'<span><span style="font-family:var(--disp);font-weight:500;font-size:14px;display:block">'+g.title+'</span>'
   +'<span style="font-size:11.5px;color:var(--soft)">'+g.sub+'</span></span>'

 var pk=peakNow(),wait=pk?18:8;
 return '<div class="rise">'

   : S.role==="intro" ? vWelcome()
   : S.tab==="home" ? vHome()
   : S.tab==="menu" ? vMenu()
   : S.tab==="cart" ? vCart() : vTicket();

   +[["student","Студент"],["intro","Первый вход"],["admin","Кухня"]].map(function(r){
     return '<button class="'+(S.role===r[0]?"on":"")+'" data-act="role" data-v="'+r[0]+'">'+r[1]+'</button>';}).join("")+'</div>';

 var n=cnt(), nav="";

  nav = (n>0 && S.tab!=="cart"
    ? '<button class="cartbar" data-act="tab" data-v="cart"><span>Перейти к заказу · '+n+'</span>'
      +'<span style="font-family:var(--disp);font-weight:600;font-size:15px">'+rub(sum()+FEE)+'</span></button>' : "")
   +'<nav>'+[["home","Главная","home"],["menu","Меню","menu"],["cart","Заказ","bag"]].map(function(t){
     var on=S.tab===t[0], c=on?"var(--terra)":"rgba(239,236,231,.55)";
     return '<button class="'+(on?"on":"")+'" data-act="tab" data-v="'+t[0]+'">'
      +'<span style="position:relative;display:block">'+svg(t[2],c)
      +(t[0]==="cart"&&n>0?'<span class="badge">'+n+'</span>':'')+'</span>'
      +'<span class="lb">'+t[1]+'</span></button>';}).join("")+'</nav>';
 }

 document.getElementById("app").innerHTML =
   roles
   +'<div class="hd"><div class="logo">МОНТЕ<small>КАФЕ</small></div><span>МГИМО · корпус А</span></div>'
   +'<div class="body">'+body+'</div>'+nav;
}

/* ---------- события ---------- */
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act]"); if(!el)return;
 var a=el.getAttribute("data-act"), v=el.getAttribute("data-v");
 if(a==="role"){S.role=v;S.tab="home";S.cart={};S.step=0;}
 else if(a==="tab"){S.tab=v;}
 else if(a==="cat"){S.cat=v;S.tab="menu";}
 else if(a==="mode"){S.mode=v;}
 else if(a==="slot"){S.slot=v;}
 else if(a==="grp"){S.grp=S.grp===v?"":v;}
 else if(a==="add"){S.cart[v]=(S.cart[v]||0)+1;}
 else if(a==="rem"){if(--S.cart[v]<=0)delete S.cart[v];}
 else if(a==="repeat"){S.cart={};for(var k in LAST)S.cart[k]=LAST[k];S.tab="cart";}
 else if(a==="pay"){S.tab="ticket";S.step=0;
   setTimeout(function(){if(S.tab==="ticket"){S.step=1;render();}},1800);
   setTimeout(function(){if(S.tab==="ticket"){S.step=2;render();}},5200);
   if(TG&&TG.HapticFeedback)try{TG.HapticFeedback.notificationOccurred("success");}catch(x){}}
 else if(a==="again"){S.cart={};S.tab="home";S.step=0;}
 else if(a==="start"){S.role="student";S.tab="menu";}
 else if(a==="view"){S.view=v;}
 else if(a==="filter"){S.filter=v;}
 else if(a==="hist"){S.hist=S.hist===v?"":v;}
 else if(a==="stop"){S.stops[v]=!S.stops[v];}
 else if(a==="adv"){S.orders=S.orders.map(function(o){return o.num===v?
   {num:o.num,who:o.who,at:o.at,st:o.st,items:o.items,left:o.left,state:o.state==="new"?"cooking":"done"}:o;});}
 else return;
 render();
});

render();
})();
</script>
</body>
</html>
